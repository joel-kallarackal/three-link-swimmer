train:
  out: runs/ppo
  total_steps: 20_000_000
  seed: 0
  n_envs: 8
  torch_threads: 2
  eval_every: 500_000
  val_set: val_sparse     

curriculum:
  threshold: 0.7
  threshold_min: 0.5
  window: 200
  p_hardest: 0.2         # fraction of episodes at exactly the current level
  start_level: 0

layout:
  n_obstacles: [0, 5]   
  p_blocked: 0.5        # P(an obstacle is forced across the start to goal line)

reward:
  progress: geodesic     # geodesic (obstacle aware) | euclidean (straight line)
  shaping_inflate: null
  clearance: closest     # closest (closest body point) | per_point (7 body points, summed)
  w_clearance: 0.1       # penalty weight below safe_distance
  safe_distance: 0.3     # m, body to nearest obstacle or wall
  w_approach: 0.0        # penalty for closing on obstacles faster than approach_rate * clearance
  approach_rate: 1.0     # 1/s

ppo:
  n_steps: 1024            
  batch_size: 1024
  n_epochs: 10
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005      
  target_kl: 0.03
  log_std_init: -0.5
  net: [256, 256]

physics:
  thruster:
    max_force: 3.0         # N
    time_constant: 0.15    # s, first-order lag (0 = instantaneous)
